name: Daily Shorts Bot

on:
  schedule:
    - cron: '0 10 * * *' # Runs at 10:00 UTC daily
  workflow_dispatch:      # Allows you to click "Run Now" manually

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      # 1. Download Code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. 🧹 FREE UP DISK SPACE (CRITICAL STEP)
      # This deletes pre-installed Android/DotNet tools to give you ~10GB extra space.
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      # 3. Install System Tools
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick ghostscript

      # 4. Fix ImageMagick Policy (For text burning)
      - name: Fix ImageMagick Policy
        run: |
          sudo sed -i 's/none/read,write/g' /etc/ImageMagick-6/policy.xml

      # 5. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 6. 📉 INSTALL LIBRARIES (THE "DIET" VERSION)
      - name: Install Pip Packages
        run: |
          pip install --upgrade pip
          
          # FORCE install the small CPU version of Torch first (saves 4GB!)
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          
          # NOW install the rest. Pip will see Torch is already there and skip the huge download.
          pip install -r requirements.txt

      # 7. Create Credentials with DEEP LOGGING
      - name: Create Credential Files (Debug Mode)
        env:
          # Load secrets into env vars to avoid quoting issues
          CLIENT_SECRET_DATA: ${{ secrets.YOUTUBE_CLIENT_SECRETS }}
          TOKEN_DATA: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          # 1. Write the files
          echo "$CLIENT_SECRET_DATA" > client_secrets.json
          echo "$TOKEN_DATA" > token.json
          
          # 2. DEBUG: List files to see if they exist
          echo "📂 LISTING FILES IN CURRENT FOLDER:"
          ls -lh
          
          # 3. DEBUG: Check 'token.json' specifically
          echo "----------------------------------------"
          echo "🕵️ CHECKING token.json:"
          
          if [ -s token.json ]; then
            echo "✅ File exists and is not empty."
            echo "📏 File size: $(wc -c < token.json) bytes"
            
            # Print the first 20 characters to verify content (Safe)
            # This tells us if it starts with valid JSON like {"token":...
            echo "👀 First 20 chars: $(head -c 20 token.json)"
          else
            echo "❌ CRITICAL ERROR: token.json is MISSING or EMPTY (0 bytes)!"
            echo "   This means the GitHub Secret is empty."
          fi
          echo "----------------------------------------"

      # 8. Run the Bot
      - name: Run Main Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main.py

      # 9. Upload Result (For debugging)
      - name: Upload Result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: final_short_automated.mp4
