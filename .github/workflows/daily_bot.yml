name: Daily Shorts Bot

# Schedule: Runs at 10:00 UTC every day
on:
  schedule:
    - cron: '0 10 * * *'
  # Allows you to click "Run Now" button for testing
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      # 1. Download the code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Install System Tools (FFmpeg & ImageMagick)
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick ghostscript

      # 3. Modify ImageMagick Policy (Fix for text burning on Linux)
      - name: Fix ImageMagick Policy
        run: |
          # Allows ImageMagick to read/write text (often blocked by default security)
          sudo sed -i 's/none/read,write/g' /etc/ImageMagick-6/policy.xml

      # 4. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10' # Stable version

      # 5. Install Python Libraries
      - name: Install Pip Packages
        run: |
          pip install --upgrade pip
          pip install google-generativeai edge-tts moviepy openai-whisper feedparser google-auth-oauthlib google-api-python-client pillow requests

      # 6. Recreate Sensitive Files from Secrets
      - name: Create Credential Files
        run: |
          echo '${{ secrets.YOUTUBE_CLIENT_SECRETS }}' > client_secrets.json
          echo '${{ secrets.YOUTUBE_TOKEN_JSON }}' > token.json
        # Note: Single quotes '' are crucial here to handle JSON format!

      # 7. Run the Bot
      - name: Run Main Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main.py

      # 8. (Optional) Upload the Video as an Artifact so you can see it
      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: final_short_automated.mp4