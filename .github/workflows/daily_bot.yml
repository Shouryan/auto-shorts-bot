name: Daily Shorts Bot

# Schedule: Runs at 10:00 UTC every day
on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      # 1. Download the code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Free up Disk Space (Crucial for Audio/Video processing)
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      # 3. Install System Tools
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick ghostscript

      # 4. Fix ImageMagick Policy
      - name: Fix ImageMagick Policy
        run: |
          sudo sed -i 's/none/read,write/g' /etc/ImageMagick-6/policy.xml

      # 5. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 6. Install Pip Packages (optimized for CPU)
      - name: Install Pip Packages
        run: |
          pip install --upgrade pip
          # FORCE CPU VERSION of Torch (Saves ~4GB of space!)
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          # Then install the rest from requirements
          pip install -r requirements.txt

      # 7. Create Credentials
      - name: Create Credential Files
        run: |
          echo '${{ secrets.YOUTUBE_CLIENT_SECRETS }}' > client_secrets.json
          echo '${{ secrets.YOUTUBE_TOKEN_JSON }}' > token.json

      # 8. Run the Bot
      - name: Run Main Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main.py

      # 9. Upload Result (Optional)
      - name: Upload Result
        if: always() # Runs even if script fails so you can debug
        uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: final_short_automated.mp4
